[global/wm]
margin-top = 0
margin-bottom = 0
include-directory = modules

[settings]
screenchange-reload = true
compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over


; Define fallback values used by all module formats
format-foreground = #FF0000
format-background = #00FF00
;format-underline =
;format-overline =
format-spacing = 3
;format-padding =
;format-margin =
;format-offset =

[colors]
; To change color scheme, change the COLOR-SCHEME value inside ${COLOR-SCHEME.colorXX}.
; Each colorscheme is defined in file with appropriate name in colorschemes directory.
color0     = #000000
color1     = #ff5555
color2     = #50fa7b
color3     = #f1fa8c
color4     = #bd93f9
color5     = #ff79c6
color6     = #8be9fd
color7     = #bfbfbf
color8     = #4d4d4d
color9     = #ff6e67
color10    = #5af78e
color11    = #f4f99d
color12    = #caa9fa
color13    = #ff92d0
color14    = #9aedfe
color15    = #e6e6e6


background = #282a36
background-alt = #44475a
foreground = #f8f8f2
foreground-alt = #555
primary = #bd93f9
secondary = #ffb86c
alert = #ff5555
disabled = #6272a4

underline-1 = #c792ea

;################################################################################
;############                  MAINBAR-HERBST                        ############
;################################################################################

[bar/mainbar-herbst]

monitor = ${env:MONITOR}
monitor-strict = true
width = 100%
height = 2%
radius = 0.0
fixed-center = true
bottom = false
separator =

dpi = {xrdb:Xft.dpi:192}
;dpi= 192

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3
line-color = #f00


; Enable support for inter-process messaging
; See the Messaging wiki page for more details.
enable-ipc = true

border-size = 0
;border-left-size = 0
;border-right-size = 25
;border-top-size = 0
;border-bottom-size = 25
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin-left = 0
module-margin-right = 0


font-0 = "Ubuntu:style=Bold:size=11;2"
font-1 = "UbuntuMono Nerd Font:style=Bold:size=18;3"
font-2 = "Font Awesome 6 Free:style=Regular:pixelsize=11;1"
font-3 = "Font Awesome 6 Free:style=Solid:pixelsize=11;1"
font-4 = "Font Awesome 6 Brands:pixelsize=8;1"
font-5 = "Noto Color Emoji:size=11;1"

modules-left = ewmh xwindow
modules-center =
;modules-right = arrow1 networkspeedup networkspeeddown arrow2 memory2 arrow3 cpu2 arrow2 volume arrow3 arch-aur-updates arrow2 date
;modules-right = memory2 cpu2 battery date
modules-right = battery date
;modules-right = memory2 cpu2 volume date


scroll-up = bspwm-desknext
scroll-down = bspwm-deskprev


;################################################################################
;############                  MAINBAR-EXWM                          ############
;################################################################################


[bar/mainbar-exwm]
width = 100%
height = 2%
fixed-center = true
enable-ipc = true

background = ${colors.background}
foreground = ${colors.foreground}

dpi = {xrdb:Xft.dpi:192}

line-size = 3
line-color = #f00

border-size = 0
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = "Ubuntu:style=Bold:size=11;2"
font-1 = "UbuntuMono Nerd Font:style=Bold:size=18;3"
font-2 = "Font Awesome 6 Free:style=Regular:pixelsize=11;1"
font-3 = "Font Awesome 6 Free:style=Solid:pixelsize=11;1"
font-4 = "Font Awesome 6 Brands:pixelsize=8;1"
font-5 = "Noto Color Emoji:size=11;1"

modules-left = exwm-workspace
modules-right = temperature battery date

cursor-click = pointer
cursor-scroll = ns-resize
