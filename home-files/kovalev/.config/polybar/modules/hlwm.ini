[module/hlwm]
type = custom/script

exec-if = ps -C herbstluftwm >/dev/null 2>&1
exec = ~/.config/polybar/scripts/workspaces
tail = true
format-background = ${colors.background}

[module/info-hlwm-workspaces]
type = custom/script
exec = ~/.config/polybar/scripts/info-hlwm-workspaces.sh
tail = true
scroll-up = herbstclient use_index -1 --skip-visible &
scroll-down = herbstclient use_index +1 --skip-visible &

[module/test-workspaces]
type = custom/script
exec = ~/.config/polybar/scripts/test-workspace.sh
tail = true
